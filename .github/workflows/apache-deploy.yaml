name: Deploy Apache WebServer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lint HTML
        run: |
          npm install -g htmlhint
          htmlhint public-html/*.html
      - name: Test with Docker
        run: |
          docker run -d -p 8080:80 -v $(pwd)/public-html:/usr/local/apache2/htdocs/ httpd:alpine
          sleep 5
          curl -f http://localhost:8080/ || exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and run Apache in Docker
        run: |
          docker build -t apache-site .
          docker run -d -p 80:80 --name apache-container apache-site
          sleep 5
      - name: Test deployment
        run: curl -f http://localhost/ || exit 1
      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed. Check logs."